{% extends "base.html" %}

{% block content %}
<h2>All Posts</h2>

{% if posts|length == 0 %}
    <p>No posts yet.</p>
{% else %}
    <ul>
    {% for post in posts %}
        <li>
            <a href="{{ url_for('post_detail', post_id=post.id) }}">
                {{ post.title }}
            </a>
            by {{ post.username }} on {{ post.created_at }}
        </li>
    {% endfor %}
    </ul>
{% endif %}
{% endblock %}
